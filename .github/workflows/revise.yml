# Your change request from Telegram: Claude edits the story, everything is rebuilt and sent back for review.
name: revise
on:
  workflow_dispatch:
    inputs:
      slug: { description: "Story to change", required: true }
      feedback: { description: "What to change", required: true }
concurrency: { group: "revise-${{ inputs.slug }}", cancel-in-progress: true }
permissions: { contents: write }
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SLUG: ${{ inputs.slug }}
      FEEDBACK: ${{ inputs.feedback }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: ./.github/actions/setup
      - run: python3 automation/release.py download-src "$SLUG"
      - name: Claude applies your feedback
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOICE: kokoro       # fast voice for Claude's checks; the cloned voice (if on) is made in the next step
        run: |
          ./automation/run_claude.sh "REVISION of the existing reel stories/$SLUG (see 'Revisions' in CLAUDE.md). Gigi's feedback, verbatim: \"$FEEDBACK\". Apply it, keep every rule in PLAYBOOK.md and CLAUDE.md, re-run the pipeline steps 0-6 and the checks. Do not change the schedule."
      - id: check
        run: python3 automation/validate.py "$SLUG" --report-only
      - name: Render and send the new version
        env: { CONCURRENCY: "4", GOOGLE_TTS_KEY: "${{ secrets.GOOGLE_TTS_KEY }}" }
        run: |
          # cloned or Chirp voice on: re-voice (only the changed phrases) and rebuild from the voice step; else just render
          FROM=$(python3 -c "import json; c=json.load(open('config.json')); s=json.load(open('stories/$SLUG/story.json')); e=(c.get('voice_engine') or {}).get('es' if s.get('lang','en').startswith('es') else 'en') or {}; print(1 if (c.get('voice_clone') or {}).get('enabled') or e.get('engine')=='chirp' else 7)")
          ./make_reel.sh "$SLUG" "$FROM" 8
          python3 automation/release.py upload-src "$SLUG"
          python3 automation/release.py upload "$SLUG"
          python3 automation/bot.py review "$SLUG" --revised
      - if: always()
        run: ./automation/commit.sh "revised $SLUG"
      - name: If it failed, put the previous version back up for review
        if: failure()
        run: |
          python3 -c "import sys; sys.path.insert(0,'automation'); from common import set_state; set_state('$SLUG', status='sent')"
          if [ -f "$RUNNER_TEMP/claude_limit" ]; then WHY="your Claude usage limit was reached"; else WHY="something went wrong (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"; fi
          python3 automation/bot.py say "⚠️ I couldn't make the changes to $SLUG: $WHY. The previous version is still valid — tap ✅ on it to publish, or send your change again later."
          ./automation/commit.sh "revision of $SLUG failed"
