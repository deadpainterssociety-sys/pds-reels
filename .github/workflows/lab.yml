# Learning loop, part 2: Monday and Thursday, Claude analyses the data (LAB.md) and sends a brief to Telegram with
# 1-3 proposed formula changes, each with ✅ / ❌. ✅ writes it into PLAYBOOK.md / EXPERIMENTS.md (bot.py).
name: lab
on:
  schedule:
    - cron: "17 9 * * 1,4"          # Mon + Thu 10:17 Madrid (winter)
  workflow_dispatch:
    inputs:
      waves: { description: "also scan topic waves now (normally every other Monday)", type: boolean, default: false }
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 automation/metrics.py pull lab
      - name: Topic waves (every other Monday, automation/waves.py)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
          WAVES: ${{ inputs.waves }}
        run: |
          if [ "$WAVES" = "true" ] || { [ "$(TZ=Europe/Madrid date +%u)" = 1 ] && [ $(( 10#$(date +%V) % 2 )) = 1 ]; }; then
            python3 automation/waves.py collect lab/waves || echo "topic waves failed: the brief goes out without them"
          else echo "not a waves Monday"; fi
      - name: Claude analyses (LAB.md)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./automation/run_claude.sh "Write today's analysis brief, following LAB.md exactly (it is your complete brief). Today is $(TZ=Europe/Madrid date +%F)."
      - run: python3 automation/lab.py publish lab
      - if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/claude_limit" ]; then python3 automation/bot.py say "⏳ The analysis brief hit the Claude usage limit; it will run again on the next Monday/Thursday (or Actions → lab → Run workflow)."
          else python3 automation/bot.py say "⚠️ The analysis brief failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
