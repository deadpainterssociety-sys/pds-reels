# Market research and image downloads for long-form videos (read-only YouTube API calls + Wikimedia Commons).
# Triggered by a change to research/request.json. The results are encrypted with research/pubkey.pem and pushed to
# the branch research-data (this repo is public; only the holder of the private key can read them).
name: research
on:
  push:
    paths: ["research/request.json"]
  workflow_dispatch:
concurrency: { group: research, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 automation/yt_research.py run research/request.json research-out
      - name: Topic waves (test run of the lab's scan)
        if: hashFiles('research/request.json') != ''
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('research/request.json')).get('waves') else 1)"; then
            python3 automation/waves.py collect research-out/waves
          fi
      - name: Case-study media (audio, 360p video, subtitles), for analysis only; encrypted with the rest
        continue-on-error: true
        run: |
          ids=$(python3 -c "import json;print(' '.join(json.load(open('research/request.json')).get('download',[])))")
          [ -n "$ids" ] || exit 0
          pip install -q -U yt-dlp youtube-transcript-api
          mkdir -p research-out/media
          for id in $ids; do
            # YouTube often asks datacenter machines to sign in: try a few player clients, then the transcript alone
            for pc in default tv web_safari mweb ios android_vr; do
              yt-dlp -q --no-warnings --no-playlist --extractor-args "youtube:player_client=$pc" \
                -f "bv*[height<=360][ext=mp4]+ba[ext=m4a]/b[height<=360]/b" --write-auto-subs --write-subs --sub-langs "en.*" \
                --sub-format vtt -o "research-out/media/%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$id" && { echo "ok with $pc"; break; } \
                || echo "failed with $pc"
            done
            ls research-out/media/$id.* >/dev/null 2>&1 || python3 - "$id" <<'PY2' || echo "transcript failed for $id"
          import json, sys
          from youtube_transcript_api import YouTubeTranscriptApi
          t = YouTubeTranscriptApi().fetch(sys.argv[1], languages=["en"])
          json.dump([{"t": s.start, "d": s.duration, "text": s.text} for s in t], open(f"research-out/media/{sys.argv[1]}.transcript.json", "w"))
          print("transcript ok", len(t))
          PY2
          done
          ls -la research-out/media
      - name: Encrypt and push to research-data
        if: always()
        run: |
          [ -d research-out ] || exit 0
          tar czf r.tgz -C research-out .
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in r.tgz -out r.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey research/pubkey.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out key.enc
          mkdir pub && split -b 45m -d r.enc pub/part- && mv key.enc pub/ && rm -f k.bin
          cd pub && git init -q && git checkout -q -b research-data && git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "research run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-data
