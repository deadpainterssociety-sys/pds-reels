# The Spanish channel (automation/es.py): render the next Spanish twin in Gacrux's voice and post it. 19:00 and 01:00
# Madrid (winter time; an hour later in summer).
name: es
on:
  schedule:
    - cron: "33 17 * * *"
    - cron: "33 23 * * *"
  workflow_dispatch:
    inputs:
      slug: { description: "a specific Spanish story (empty = the next one)", required: false, default: "" }
concurrency: { group: "es", cancel-in-progress: false }
permissions: { contents: write }
jobs:
  es:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
      CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: python3 automation/es.py pick ${{ inputs.slug }}
      - if: steps.pick.outputs.slug != ''
        uses: ./.github/actions/setup
      - name: Render
        if: steps.pick.outputs.slug != ''
        env: { SLUG: "${{ steps.pick.outputs.slug }}" }
        run: |
          python3 automation/release.py download-src "$SLUG" || echo "no saved images: fetching them from Wikimedia"
          ./make_reel.sh "$SLUG" 0 8 2>&1 | grep -v -E "it/s\]|Warning|warn" | tail -30
          python3 automation/validate.py "$SLUG" --report-only | tail -8 || true
          python3 automation/release.py upload-src "$SLUG" || true
      - name: Publish
        if: steps.pick.outputs.slug != ''
        run: python3 automation/es.py publish "${{ steps.pick.outputs.slug }}"
      - if: steps.pick.outputs.slug != ''
        run: ./automation/commit.sh "es - ${{ steps.pick.outputs.slug }}" stories schedule_es.json
      - if: failure()
        run: python3 automation/bot.py say "⚠️ The Spanish channel job failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
