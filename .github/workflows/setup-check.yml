# Check every connection (run it after adding secrets). Weekly it also refreshes the Instagram token (60-day life)
# and only messages you if something is broken.
name: setup-check
on:
  workflow_dispatch: {}
  schedule:
    - cron: "29 7 * * 1"          # Mondays
concurrency: { group: inbox, cancel-in-progress: false }   # shares the Telegram offset with the inbox job
permissions: { contents: write, pages: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the Instagram token (weekly)
        if: github.event_name == 'schedule' && env.IG_ACCESS_TOKEN != '' && env.GH_PAT != ''
        run: python3 automation/instagram.py refresh
      - run: python3 automation/setup_check.py ${{ github.event_name == 'schedule' && '--weekly' || '' }}
      - if: always()
        run: ./automation/commit.sh "setup check"
